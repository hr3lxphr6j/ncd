[package]
name = "ncd-cli"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "ncd"
path = "src/main.rs"

[dependencies]
ncd = { path = "../core" }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
futures-util = "0.3.31"
kdam = "0.6.3"
lazy_static = "1.5.0"
log = "0.4.29"
regex = "1.10"
tokio = { version = "1", features = ["full"] }
